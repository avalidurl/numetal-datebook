name: deploy

# Ships the datebook API Worker (datebook-staging → api.ishtar.numetal.xyz) on push to main.
# Runtime secrets (ACCESS_KEY, PAY_TO, X402_MODE, DIDIT_*, PRIVY_*, ENCRYPTION_KEY, …) are NOT
# managed here — they already live on the Worker and persist across deploys. This workflow only
# ships code/config. Use scripts/deploy.sh locally when a deploy also needs migrations or a
# secret rotation.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "wrangler.toml"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Enable pnpm (pinned) via corepack
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Deploy Worker (pinned wrangler)
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
