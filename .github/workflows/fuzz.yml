name: fuzz
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Property-based fuzzing (fast-check) — fast + BLOCKING on every PR/push. The COVERAGE-GUIDED layer
# (Jazzer.js) is run by ClusterFuzzLite instead — see .github/workflows/cflite_*.yml + .clusterfuzzlite/.
jobs:
  property:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: property-based fuzz (fast-check) — must pass
        run: pnpm fuzz
